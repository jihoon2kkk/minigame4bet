<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사다리타기 — 가볍게 한 판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12131a;
    --panel: #1b1d28;
    --panel-2: #20232f;
    --line: #33374a;
    --ink: #f1eee6;
    --muted: #9295a6;
    --gold: #f5b942;
    --gold-ink: #241a06;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    min-height: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{
    max-width: 520px;
    margin: 0 auto;
    padding: 36px 20px 64px;
  }
  .hero{
    text-align: center;
    margin-bottom: 28px;
  }
  .hero h1{
    font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    font-weight: 400;
    font-size: clamp(34px, 9vw, 46px);
    letter-spacing: 1px;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .hero p{
    margin: 0;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.6;
  }
  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .panel-title{
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 14px;
    font-weight: 500;
  }
  .stepper{
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .stepper button{
    width: 38px;
    height: 38px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--ink);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .stepper button:active{ transform: scale(0.96); }
  .stepper button:disabled{ opacity: 0.35; cursor: not-allowed; }
  .stepper .count{
    font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    font-size: 26px;
    min-width: 30px;
    text-align: center;
  }
  .stepper .count-label{ color: var(--muted); font-size: 13.5px; }

  .name-row{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .swatch{
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .name-row input{
    flex: 1;
    min-width: 0;
    background: var(--panel-2);
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    outline: none;
  }
  .name-row input:focus{ border-color: var(--gold); }

  .toggle-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 10px;
    margin-top: 8px;
    border-top: 1px solid var(--line);
  }
  .toggle-row span{ font-size: 14px; color: var(--ink); }
  .toggle-row small{ display:block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .switch{
    width: 42px;
    height: 24px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
  }
  .switch::after{
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform .18s ease, background .18s ease;
  }
  .switch.on{ border-color: var(--gold); }
  .switch.on::after{ transform: translateX(18px); background: var(--gold); }

  .label-inputs{ margin-top: 12px; display: none; }
  .label-inputs.show{ display: block; }
  .label-row{ display:flex; align-items:center; gap:10px; margin-bottom: 8px; }
  .label-row .rank-badge{
    font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    font-size: 13px;
    color: var(--gold);
    width: 34px;
    flex-shrink: 0;
    text-align: right;
  }
  .label-row input{
    flex: 1;
    background: var(--panel-2);
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 9px 11px;
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .label-row input:focus{ border-color: var(--gold); }

  .ladder-panel{
    padding: 20px 14px;
  }
  .ladder-scroll{
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
  }
  svg{ display: block; }

  .col-label{
    font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    font-size: 12px;
  }
  .rank-label{
    font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    font-size: 12px;
    fill: var(--gold);
  }

  .cta{
    width: 100%;
    margin-top: 4px;
    padding: 15px;
    border-radius: 10px;
    border: none;
    background: var(--gold);
    color: var(--gold-ink);
    font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    font-size: 17px;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .cta:disabled{ opacity: 0.45; cursor: not-allowed; }
  .cta.secondary{
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--ink);
  }

  .results{
    display: none;
  }
  .results.show{ display: block; }
  .result-row{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
  }
  .result-row:last-child{ border-bottom: none; }
  .result-row .swatch{ width: 12px; height: 12px; }
  .result-row .rname{ flex: 1; font-size: 15px; }
  .result-row .rrank{
    font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    font-size: 15px;
    color: var(--gold);
  }
  .back-link{
    display: inline-block;
    color: var(--muted);
    font-size: 13.5px;
    text-decoration: none;
    margin-bottom: 10px;
  }
  .back-link:active{ color: var(--gold); }
  .footer-note{
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 22px;
    line-height: 1.6;
  }

  @media (max-width: 380px){
    .wrap{ padding: 28px 14px 48px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <a href="../index.html" class="back-link">← 게임 목록</a>
  <div class="hero">
    <h1>사다리타기</h1>
    <p>이름 넣고, 사다리 타고, 결과는 하늘의 뜻 — 가볍게 한 판 내기용</p>
  </div>

  <div class="panel" id="setupPanel">
    <p class="panel-title">참가자 수</p>
    <div class="stepper">
      <button id="minusBtn" aria-label="줄이기">−</button>
      <div class="count" id="countDisplay">4</div>
      <button id="plusBtn" aria-label="늘리기">+</button>
      <span class="count-label">명 (2~10명)</span>
    </div>

    <p class="panel-title" style="margin-bottom:8px;">참가자 이름</p>
    <div id="nameInputs"></div>

    <div class="toggle-row">
      <div>
        <span>결과 라벨 직접 정하기</span>
        <small>예: 1등 대신 "커피 사기", 꼴등 대신 "설거지"</small>
      </div>
      <div class="switch" id="labelToggle" role="button" aria-label="결과 라벨 직접 정하기"></div>
    </div>
    <div class="label-inputs" id="labelInputs"></div>
  </div>

  <div class="panel ladder-panel">
    <div class="ladder-scroll">
      <svg id="ladderSvg"></svg>
    </div>
    <button class="cta" id="playBtn" style="margin-top:16px;">사다리 타기 시작</button>
    <button class="cta secondary" id="resetBtn" style="display:none; margin-top:10px;">다시 하기</button>
  </div>

  <div class="panel results" id="resultsPanel">
    <p class="panel-title">결과</p>
    <div id="resultsList"></div>
  </div>

  <p class="footer-note">사다리는 매번 새로 만들어져요. 순서는 무작위로 결정되며,<br>누구도 결과를 미리 알 수 없어요.</p>
</div>

<script>
(function(){
  var PALETTE = ['#F2545B','#F2994A','#F2C94C','#6FCF97','#56CCF2','#2F80ED','#BB6BD9','#EB5FA9','#27AE9E','#BDBDBD'];

  var state = {
    count: 4,
    names: [],
    customLabels: false,
    labels: [],
    playing: false,
    played: false
  };

  var nameInputsEl = document.getElementById('nameInputs');
  var countDisplay = document.getElementById('countDisplay');
  var minusBtn = document.getElementById('minusBtn');
  var plusBtn = document.getElementById('plusBtn');
  var labelToggle = document.getElementById('labelToggle');
  var labelInputsEl = document.getElementById('labelInputs');
  var svg = document.getElementById('ladderSvg');
  var playBtn = document.getElementById('playBtn');
  var resetBtn = document.getElementById('resetBtn');
  var resultsPanel = document.getElementById('resultsPanel');
  var resultsList = document.getElementById('resultsList');
  var setupPanel = document.getElementById('setupPanel');

  function defaultLabel(i, n){
    return (i === n - 1) ? '꼴등' : (i + 1) + '등';
  }

  function renderNameInputs(){
    nameInputsEl.innerHTML = '';
    for (var i = 0; i < state.count; i++){
      var row = document.createElement('div');
      row.className = 'name-row';

      var sw = document.createElement('div');
      sw.className = 'swatch';
      sw.style.background = PALETTE[i % PALETTE.length];

      var input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 8;
      input.placeholder = '참가자 ' + (i + 1);
      input.value = state.names[i] || '';
      input.dataset.idx = i;
      input.addEventListener('input', function(e){
        state.names[e.target.dataset.idx] = e.target.value;
      });

      row.appendChild(sw);
      row.appendChild(input);
      nameInputsEl.appendChild(row);
    }
  }

  function renderLabelInputs(){
    labelInputsEl.innerHTML = '';
    for (var i = 0; i < state.count; i++){
      var row = document.createElement('div');
      row.className = 'label-row';

      var badge = document.createElement('div');
      badge.className = 'rank-badge';
      badge.textContent = (i + 1) + '.';

      var input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 10;
      input.placeholder = defaultLabel(i, state.count);
      input.value = state.labels[i] || '';
      input.dataset.idx = i;
      input.addEventListener('input', function(e){
        state.labels[e.target.dataset.idx] = e.target.value;
      });

      row.appendChild(badge);
      row.appendChild(input);
      labelInputsEl.appendChild(row);
    }
  }

  function getName(i){
    return (state.names[i] && state.names[i].trim()) || ('참가자 ' + (i + 1));
  }
  function getLabel(i){
    return (state.labels[i] && state.labels[i].trim()) || defaultLabel(i, state.count);
  }

  minusBtn.addEventListener('click', function(){
    if (state.count <= 2 || state.playing) return;
    state.count--;
    countDisplay.textContent = state.count;
    renderNameInputs();
    renderLabelInputs();
    buildLadder();
  });
  plusBtn.addEventListener('click', function(){
    if (state.count >= 10 || state.playing) return;
    state.count++;
    countDisplay.textContent = state.count;
    renderNameInputs();
    renderLabelInputs();
    buildLadder();
  });
  labelToggle.addEventListener('click', function(){
    if (state.playing) return;
    state.customLabels = !state.customLabels;
    labelToggle.classList.toggle('on', state.customLabels);
    labelInputsEl.classList.toggle('show', state.customLabels);
  });

  // ---- Ladder (amidakuji) generation ----
  var COL_W = 46;
  var ROW_H = 20;
  var TOP_PAD = 34;
  var BOTTOM_PAD = 34;
  var ladder = null; // { n, rows, rungs: [[bool]], finalPos: [] }

  function buildLadder(){
    var n = state.count;
    var rows = Math.max(10, n * 3);
    var rungs = [];
    for (var r = 0; r < rows; r++){
      var rowRungs = new Array(n - 1).fill(false);
      var skip = false;
      for (var g = 0; g < n - 1; g++){
        if (skip){ skip = false; continue; }
        if (Math.random() < 0.42){
          rowRungs[g] = true;
          skip = true;
        }
      }
      rungs.push(rowRungs);
    }
    // ensure every gap has at least one rung somewhere, for visual balance
    for (var g2 = 0; g2 < n - 1; g2++){
      var has = rungs.some(function(row){ return row[g2]; });
      if (!has){
        var rr = Math.floor(Math.random() * rows);
        rungs[rr][g2] = true;
      }
    }

    // compute final column for each starting column
    var finalPos = [];
    for (var startCol = 0; startCol < n; startCol++){
      var col = startCol;
      for (var row = 0; row < rows; row++){
        if (col < n - 1 && rungs[row][col]) col = col + 1;
        else if (col > 0 && rungs[row][col - 1]) col = col - 1;
      }
      finalPos.push(col);
    }

    ladder = { n: n, rows: rows, rungs: rungs, finalPos: finalPos };
    drawLadder();
  }

  function pathPoints(startCol){
    var n = ladder.n, rows = ladder.rows, rungs = ladder.rungs;
    var col = startCol;
    var pts = [{ x: colX(col), y: TOP_PAD }];
    for (var row = 0; row < rows; row++){
      var y1 = TOP_PAD + row * ROW_H;
      var y2 = TOP_PAD + (row + 1) * ROW_H;
      if (col < n - 1 && rungs[row][col]){
        pts.push({ x: colX(col), y: y1 });
        pts.push({ x: colX(col + 1), y: y1 });
        col = col + 1;
      } else if (col > 0 && rungs[row][col - 1]){
        pts.push({ x: colX(col), y: y1 });
        pts.push({ x: colX(col - 1), y: y1 });
        col = col - 1;
      }
      pts.push({ x: colX(col), y: y2 });
    }
    return pts;
  }

  function colX(c){ return c * COL_W + COL_W / 2; }

  function svgNS(tag){ return document.createElementNS('http://www.w3.org/2000/svg', tag); }

  function drawLadder(){
    var n = ladder.n, rows = ladder.rows, rungs = ladder.rungs;
    var width = n * COL_W;
    var height = TOP_PAD + rows * ROW_H + BOTTOM_PAD;
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    svg.innerHTML = '';

    // top labels (names)
    for (var i = 0; i < n; i++){
      var t = svgNS('text');
      t.setAttribute('x', colX(i));
      t.setAttribute('y', TOP_PAD - 12);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('class', 'col-label');
      t.setAttribute('fill', PALETTE[i % PALETTE.length]);
      t.textContent = truncate(getName(i), 4);
      svg.appendChild(t);
    }

    // vertical lines
    for (var c = 0; c < n; c++){
      var v = svgNS('line');
      v.setAttribute('x1', colX(c));
      v.setAttribute('y1', TOP_PAD);
      v.setAttribute('x2', colX(c));
      v.setAttribute('y2', TOP_PAD + rows * ROW_H);
      v.setAttribute('stroke', '#33374a');
      v.setAttribute('stroke-width', '2');
      svg.appendChild(v);
    }

    // rungs
    for (var row = 0; row < rows; row++){
      for (var g = 0; g < n - 1; g++){
        if (rungs[row][g]){
          var y = TOP_PAD + row * ROW_H + ROW_H / 2;
          var h = svgNS('line');
          h.setAttribute('x1', colX(g));
          h.setAttribute('y1', y);
          h.setAttribute('x2', colX(g + 1));
          h.setAttribute('y2', y);
          h.setAttribute('stroke', '#4a4f68');
          h.setAttribute('stroke-width', '2');
          svg.appendChild(h);
        }
      }
    }

    // bottom labels (ranks)
    for (var j = 0; j < n; j++){
      var rt = svgNS('text');
      rt.setAttribute('x', colX(j));
      rt.setAttribute('y', TOP_PAD + rows * ROW_H + 22);
      rt.setAttribute('text-anchor', 'middle');
      rt.setAttribute('class', 'rank-label');
      rt.textContent = getLabel(j);
      svg.appendChild(rt);
    }

    // hidden path elements per participant, drawn on play
    ladder.pathEls = [];
    for (var p = 0; p < n; p++){
      var pts = pathPoints(p);
      var d = 'M ' + pts[0].x + ' ' + pts[0].y + ' ' + pts.slice(1).map(function(pt){ return 'L ' + pt.x + ' ' + pt.y; }).join(' ');
      var path = svgNS('path');
      path.setAttribute('d', d);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', PALETTE[p % PALETTE.length]);
      path.setAttribute('stroke-width', '3.5');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      path.style.opacity = '0';
      svg.appendChild(path);
      ladder.pathEls.push(path);
    }
  }

  function truncate(str, max){
    return str.length > max ? str.slice(0, max) + '…' : str;
  }

  // ---- Play ----
  playBtn.addEventListener('click', function(){
    if (state.playing || state.played) return;
    state.playing = true;
    playBtn.disabled = true;
    setupPanel.style.opacity = '0.5';
    setupPanel.style.pointerEvents = 'none';

    var n = ladder.n;
    var maxDur = 0;
    for (var p = 0; p < n; p++){
      (function(p){
        var path = ladder.pathEls[p];
        var len = path.getTotalLength();
        path.style.opacity = '1';
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
        var delay = p * 130;
        var dur = 900;
        maxDur = Math.max(maxDur, delay + dur);
        setTimeout(function(){
          path.style.transition = 'stroke-dashoffset ' + dur + 'ms ease-in-out';
          path.style.strokeDashoffset = '0';
        }, delay);
      })(p);
    }

    setTimeout(function(){
      showResults();
      state.playing = false;
      state.played = true;
      playBtn.style.display = 'none';
      resetBtn.style.display = 'block';
    }, maxDur + 150);
  });

  function showResults(){
    var n = ladder.n;
    var rows = [];
    for (var i = 0; i < n; i++){
      rows.push({ name: getName(i), color: PALETTE[i % PALETTE.length], label: getLabel(ladder.finalPos[i]) });
    }
    resultsList.innerHTML = '';
    rows.forEach(function(r){
      var row = document.createElement('div');
      row.className = 'result-row';
      var sw = document.createElement('div');
      sw.className = 'swatch';
      sw.style.background = r.color;
      var name = document.createElement('div');
      name.className = 'rname';
      name.textContent = r.name;
      var rank = document.createElement('div');
      rank.className = 'rrank';
      rank.textContent = r.label;
      row.appendChild(sw);
      row.appendChild(name);
      row.appendChild(rank);
      resultsList.appendChild(row);
    });
    resultsPanel.classList.add('show');
    resultsPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  resetBtn.addEventListener('click', function(){
    state.playing = false;
    state.played = false;
    setupPanel.style.opacity = '1';
    setupPanel.style.pointerEvents = 'auto';
    resultsPanel.classList.remove('show');
    playBtn.style.display = 'block';
    playBtn.disabled = false;
    resetBtn.style.display = 'none';
    buildLadder();
  });

  // init
  renderNameInputs();
  renderLabelInputs();
  buildLadder();
})();
</script>
</body>
</html>
