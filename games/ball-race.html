<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>탁구공 레이스 — 가볍게 한 판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12131a;
    --panel: #1b1d28;
    --panel-2: #20232f;
    --line: #33374a;
    --ink: #f1eee6;
    --muted: #9295a6;
    --gold: #f5b942;
    --gold-ink: #241a06;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    min-height: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{ max-width: 520px; margin: 0 auto; padding: 36px 20px 64px; }
  .hero{ text-align: center; margin-bottom: 28px; }
  .hero h1{
    font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    font-weight: 400;
    font-size: clamp(34px, 9vw, 46px);
    letter-spacing: 1px;
    margin: 0 0 6px;
  }
  .hero p{ margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.6; }
  .panel{ background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 20px; margin-bottom: 16px; }
  .panel-title{ font-size: 13px; color: var(--muted); margin: 0 0 14px; font-weight: 500; }
  .stepper{ display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .stepper button{
    width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer;
  }
  .stepper button:active{ transform: scale(0.96); }
  .stepper button:disabled{ opacity: 0.35; cursor: not-allowed; }
  .stepper .count{ font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif; font-size: 26px; min-width: 30px; text-align: center; }
  .stepper .count-label{ color: var(--muted); font-size: 13.5px; }
  .name-row{ display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .swatch{ width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
  .name-row input{
    flex: 1; min-width: 0; background: var(--panel-2); border: 1.5px solid var(--line);
    border-radius: 8px; padding: 10px 12px; color: var(--ink); font-family: inherit; font-size: 15px; outline: none;
  }
  .name-row input:focus{ border-color: var(--gold); }
  .toggle-row{ display: flex; align-items: center; justify-content: space-between; padding-top: 10px; margin-top: 8px; border-top: 1px solid var(--line); }
  .toggle-row span{ font-size: 14px; color: var(--ink); }
  .toggle-row small{ display:block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .switch{ width: 42px; height: 24px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); position: relative; cursor: pointer; flex-shrink: 0; }
  .switch::after{ content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .18s ease, background .18s ease; }
  .switch.on{ border-color: var(--gold); }
  .switch.on::after{ transform: translateX(18px); background: var(--gold); }
  .label-inputs{ margin-top: 12px; display: none; }
  .label-inputs.show{ display: block; }
  .label-row{ display:flex; align-items:center; gap:10px; margin-bottom: 8px; }
  .label-row .rank-badge{ font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif; font-size: 13px; color: var(--gold); width: 34px; flex-shrink: 0; text-align: right; }
  .label-row input{
    flex: 1; background: var(--panel-2); border: 1.5px solid var(--line); border-radius: 8px;
    padding: 9px 11px; color: var(--ink); font-family: inherit; font-size: 14px; outline: none;
  }
  .label-row input:focus{ border-color: var(--gold); }
  .cta{
    width: 100%; margin-top: 4px; padding: 15px; border-radius: 10px; border: none;
    background: var(--gold); color: var(--gold-ink); font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    font-size: 17px; letter-spacing: 0.5px; cursor: pointer;
  }
  .cta:disabled{ opacity: 0.45; cursor: not-allowed; }
  .cta.secondary{ background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
  .results{ display: none; }
  .results.show{ display: block; }
  .result-row{ display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
  .result-row:last-child{ border-bottom: none; }
  .result-row .swatch{ width: 12px; height: 12px; }
  .result-row .rname{ flex: 1; font-size: 15px; }
  .result-row .rrank{ font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif; font-size: 15px; color: var(--gold); }
  .back-link{ display: inline-block; color: var(--muted); font-size: 13.5px; text-decoration: none; margin-bottom: 10px; }
  .back-link:active{ color: var(--gold); }
  .footer-note{ text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 22px; line-height: 1.6; }

  /* --- 탁구공 레이스 전용 --- */
  .race-panel{ padding: 20px 16px; }
  .legend{ display: flex; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 12px; }
  .legend-chip{ display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); }
  .legend-chip .swatch{ width: 9px; height: 9px; border-radius: 50%; }
  .board-frame{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  canvas{ display: block; width: 100%; height: auto; }
  .draw-hint{ text-align:center; color: var(--muted); font-size: 13px; margin: 0 0 14px; }

  @media (max-width: 380px){ .wrap{ padding: 28px 14px 48px; } }
</style>
</head>
<body>
<div class="wrap">

  <a href="../index.html" class="back-link">← 게임 목록</a>
  <div class="hero">
    <h1>탁구공 레이스</h1>
    <p>장애물 사이를 떨어지며 먼저 도착하는 순서가 곧 순위 — 가볍게 한 판 내기용</p>
  </div>

  <div class="panel" id="setupPanel">
    <p class="panel-title">참가자 수</p>
    <div class="stepper">
      <button id="minusBtn" aria-label="줄이기">−</button>
      <div class="count" id="countDisplay">4</div>
      <button id="plusBtn" aria-label="늘리기">+</button>
      <span class="count-label">명 (2~10명)</span>
    </div>

    <p class="panel-title" style="margin-bottom:8px;">참가자 이름</p>
    <div id="nameInputs"></div>

    <div class="toggle-row">
      <div>
        <span>결과 라벨 직접 정하기</span>
        <small>예: 1등 대신 "커피 사기", 꼴등 대신 "설거지"</small>
      </div>
      <div class="switch" id="labelToggle" role="button" aria-label="결과 라벨 직접 정하기"></div>
    </div>
    <div class="label-inputs" id="labelInputs"></div>
  </div>

  <div class="panel race-panel">
    <div class="legend" id="legend"></div>
    <div class="board-frame">
      <canvas id="raceCanvas" width="300" height="460"></canvas>
    </div>
    <p class="draw-hint" id="drawHint">시작 버튼을 누르면 공들이 동시에 떨어져요</p>
    <button class="cta" id="playBtn">레이스 시작</button>
    <button class="cta secondary" id="resetBtn" style="display:none; margin-top:10px;">다시 하기</button>
  </div>

  <div class="panel results" id="resultsPanel">
    <p class="panel-title">결과</p>
    <div id="resultsList"></div>
  </div>

  <p class="footer-note">장애물 배치와 튕기는 방향은 매번 새로 정해져요.<br>누구도 결과를 미리 알 수 없어요.</p>
</div>

<script>
(function(){
  var PALETTE = ['#F2545B','#F2994A','#F2C94C','#6FCF97','#56CCF2','#2F80ED','#BB6BD9','#EB5FA9','#27AE9E','#BDBDBD'];
  var COLOR_LINE = '#3a3f56';
  var COLOR_PEG = '#4a5070';
  var COLOR_GOLD = '#f5b942';

  var W = 300, H = 460;
  var FINISH_Y = H - 26;

  var state = { count: 4, names: [], customLabels: false, labels: [], playing: false, played: false };

  var nameInputsEl = document.getElementById('nameInputs');
  var countDisplay = document.getElementById('countDisplay');
  var minusBtn = document.getElementById('minusBtn');
  var plusBtn = document.getElementById('plusBtn');
  var labelToggle = document.getElementById('labelToggle');
  var labelInputsEl = document.getElementById('labelInputs');
  var legendEl = document.getElementById('legend');
  var canvas = document.getElementById('raceCanvas');
  var ctx = canvas.getContext('2d');
  var drawHint = document.getElementById('drawHint');
  var playBtn = document.getElementById('playBtn');
  var resetBtn = document.getElementById('resetBtn');
  var resultsPanel = document.getElementById('resultsPanel');
  var resultsList = document.getElementById('resultsList');
  var setupPanel = document.getElementById('setupPanel');

  function defaultLabel(i, n){ return (i === n - 1) ? '꼴등' : (i + 1) + '등'; }

  function renderNameInputs(){
    nameInputsEl.innerHTML = '';
    for (var i = 0; i < state.count; i++){
      var row = document.createElement('div');
      row.className = 'name-row';
      var sw = document.createElement('div');
      sw.className = 'swatch';
      sw.style.background = PALETTE[i % PALETTE.length];
      var input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 8;
      input.placeholder = '참가자 ' + (i + 1);
      input.value = state.names[i] || '';
      input.dataset.idx = i;
      input.addEventListener('input', function(e){ state.names[e.target.dataset.idx] = e.target.value; refreshLegend(); });
      row.appendChild(sw);
      row.appendChild(input);
      nameInputsEl.appendChild(row);
    }
    refreshLegend();
  }

  function renderLabelInputs(){
    labelInputsEl.innerHTML = '';
    for (var i = 0; i < state.count; i++){
      var row = document.createElement('div');
      row.className = 'label-row';
      var badge = document.createElement('div');
      badge.className = 'rank-badge';
      badge.textContent = (i + 1) + '.';
      var input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 10;
      input.placeholder = defaultLabel(i, state.count);
      input.value = state.labels[i] || '';
      input.dataset.idx = i;
      input.addEventListener('input', function(e){ state.labels[e.target.dataset.idx] = e.target.value; });
      row.appendChild(badge);
      row.appendChild(input);
      labelInputsEl.appendChild(row);
    }
  }

  function getName(i){ return (state.names[i] && state.names[i].trim()) || ('참가자 ' + (i + 1)); }
  function getLabel(i){ return (state.labels[i] && state.labels[i].trim()) || defaultLabel(i, state.count); }

  function refreshLegend(){
    legendEl.innerHTML = '';
    for (var i = 0; i < state.count; i++){
      var chip = document.createElement('div');
      chip.className = 'legend-chip';
      var sw = document.createElement('div');
      sw.className = 'swatch';
      sw.style.background = PALETTE[i % PALETTE.length];
      var label = document.createElement('span');
      label.textContent = getName(i);
      chip.appendChild(sw);
      chip.appendChild(label);
      legendEl.appendChild(chip);
    }
  }

  minusBtn.addEventListener('click', function(){
    if (state.count <= 2 || state.playing) return;
    state.count--; countDisplay.textContent = state.count;
    renderNameInputs(); renderLabelInputs(); drawStaticBoard();
  });
  plusBtn.addEventListener('click', function(){
    if (state.count >= 10 || state.playing) return;
    state.count++; countDisplay.textContent = state.count;
    renderNameInputs(); renderLabelInputs(); drawStaticBoard();
  });
  labelToggle.addEventListener('click', function(){
    if (state.playing) return;
    state.customLabels = !state.customLabels;
    labelToggle.classList.toggle('on', state.customLabels);
    labelInputsEl.classList.toggle('show', state.customLabels);
  });

  // ---- Obstacle course physics ----
  var pegs = [];
  var balls = [];

  function generatePegs(){
    var list = [];
    var target = 16;
    var minGap = 32;
    var tries = 0;
    while (list.length < target && tries < 1000){
      tries++;
      var x = 22 + Math.random() * (W - 44);
      var y = 66 + Math.random() * (H - 66 - 90);
      var ok = true;
      for (var i = 0; i < list.length; i++){
        var dx = x - list[i].x, dy = y - list[i].y;
        if (Math.sqrt(dx * dx + dy * dy) < minGap){ ok = false; break; }
      }
      if (ok) list.push({ x: x, y: y, r: 6 });
    }
    return list;
  }

  function buildBalls(){
    var n = state.count;
    var margin = 26;
    var usable = W - margin * 2;
    balls = [];
    for (var i = 0; i < n; i++){
      var x = n === 1 ? W / 2 : margin + (usable * i) / (n - 1);
      balls.push({
        idx: i,
        x: x,
        y: 18,
        vx: (Math.random() - 0.5) * 0.6,
        vy: 0,
        r: 8,
        color: PALETTE[i % PALETTE.length],
        finished: false,
        rank: -1
      });
    }
  }

  function drawStaticBoard(){
    pegs = generatePegs();
    buildBalls();
    render();
  }

  function render(){
    ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = COLOR_LINE;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(0, FINISH_Y);
    ctx.lineTo(W, FINISH_Y);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = COLOR_PEG;
    pegs.forEach(function(p){
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });

    balls.forEach(function(b){
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = b.color;
      ctx.fill();
      if (b.finished){
        ctx.fillStyle = COLOR_GOLD;
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(b.rank + 1), b.x, b.y - b.r - 5);
      }
    });
  }

  var GRAVITY = 0.3;
  var MAX_VY = 7;

  function resolvePegCollision(ball, peg){
    var dx = ball.x - peg.x, dy = ball.y - peg.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var minDist = ball.r + peg.r;
    if (dist < minDist){
      if (dist < 0.01){ dist = 0.01; dx = 0.01; dy = 0.01; }
      var nx = dx / dist, ny = dy / dist;
      var overlap = minDist - dist;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      var dot = ball.vx * nx + ball.vy * ny;
      ball.vx -= 2 * dot * nx;
      ball.vy -= 2 * dot * ny;
      ball.vx *= 0.72;
      ball.vy *= 0.72;
      ball.vx += (Math.random() - 0.5) * 1.3;
    }
  }

  var arrivalOrder = [];
  var elapsedMs = 0;
  var MAX_DURATION = 9000;

  function step(){
    var allDone = true;
    for (var i = 0; i < balls.length; i++){
      var ball = balls[i];
      if (ball.finished) continue;
      allDone = false;

      ball.vy = Math.min(ball.vy + GRAVITY, MAX_VY);
      ball.vx += (Math.random() - 0.5) * 0.05;
      ball.vx *= 0.995;
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.x - ball.r < 0){ ball.x = ball.r; ball.vx = Math.abs(ball.vx) * 0.6; }
      if (ball.x + ball.r > W){ ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx) * 0.6; }

      for (var p = 0; p < pegs.length; p++){
        resolvePegCollision(ball, pegs[p]);
      }

      if (ball.y + ball.r >= FINISH_Y){
        ball.y = FINISH_Y - ball.r;
        ball.finished = true;
        ball.rank = arrivalOrder.length;
        arrivalOrder.push(ball.idx);
      }
    }

    render();
    elapsedMs += 16;

    if (!allDone && elapsedMs < MAX_DURATION){
      requestAnimationFrame(step);
    } else {
      finalizeRace();
    }
  }

  function finalizeRace(){
    var remaining = balls.filter(function(b){ return !b.finished; });
    remaining.sort(function(a, b){ return b.y - a.y; });
    remaining.forEach(function(b){
      b.finished = true;
      b.rank = arrivalOrder.length;
      arrivalOrder.push(b.idx);
    });
    render();

    var rankOf = {};
    balls.forEach(function(b){ rankOf[b.idx] = b.rank; });

    setTimeout(function(){
      showResults(rankOf);
      state.playing = false;
      state.played = true;
      playBtn.style.display = 'none';
      resetBtn.style.display = 'block';
    }, 300);
  }

  playBtn.addEventListener('click', function(){
    if (state.playing || state.played) return;
    state.playing = true;
    playBtn.disabled = true;
    setupPanel.style.opacity = '0.5';
    setupPanel.style.pointerEvents = 'none';
    drawHint.textContent = '떨어지는 중...';

    pegs = generatePegs();
    buildBalls();
    arrivalOrder = [];
    elapsedMs = 0;
    requestAnimationFrame(step);
  });

  function showResults(rankOf){
    var n = state.count;
    var rows = [];
    for (var i = 0; i < n; i++){
      rows.push({ name: getName(i), color: PALETTE[i % PALETTE.length], label: getLabel(rankOf[i]) });
    }
    resultsList.innerHTML = '';
    rows.forEach(function(r){
      var row = document.createElement('div');
      row.className = 'result-row';
      var sw = document.createElement('div');
      sw.className = 'swatch';
      sw.style.background = r.color;
      var name = document.createElement('div');
      name.className = 'rname';
      name.textContent = r.name;
      var rank = document.createElement('div');
      rank.className = 'rrank';
      rank.textContent = r.label;
      row.appendChild(sw); row.appendChild(name); row.appendChild(rank);
      resultsList.appendChild(row);
    });
    resultsPanel.classList.add('show');
    resultsPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  resetBtn.addEventListener('click', function(){
    state.playing = false;
    state.played = false;
    setupPanel.style.opacity = '1';
    setupPanel.style.pointerEvents = 'auto';
    resultsPanel.classList.remove('show');
    playBtn.style.display = 'block';
    playBtn.disabled = false;
    resetBtn.style.display = 'none';
    drawHint.textContent = '시작 버튼을 누르면 공들이 동시에 떨어져요';
    drawStaticBoard();
  });

  // init
  renderNameInputs();
  renderLabelInputs();
  drawStaticBoard();
})();
</script>
</body>
</html>
