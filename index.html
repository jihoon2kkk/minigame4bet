<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가볍게 한 판 — 미니게임 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12131a;
    --panel: #1b1d28;
    --panel-2: #20232f;
    --line: #33374a;
    --ink: #f1eee6;
    --muted: #9295a6;
    --gold: #f5b942;
    --gold-ink: #241a06;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    min-height: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 20px 64px;
  }
  .hero{
    text-align: center;
    margin-bottom: 30px;
  }
  .hero h1{
    font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    font-weight: 400;
    font-size: clamp(28px, 8vw, 38px);
    letter-spacing: 0.5px;
    margin: 0 0 8px;
  }
  .hero p{
    margin: 0;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.6;
  }
  .grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 14px;
    text-decoration: none;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    min-height: 132px;
  }
  .card .emoji{ font-size: 26px; }
  .card .title{
    font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
    font-size: 17px;
  }
  .card .desc{
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.5;
    flex: 1;
  }
  .card .badge{
    align-self: flex-start;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: 500;
  }
  .card.active{ border-color: var(--gold); }
  .card.active .badge{
    background: var(--gold);
    color: var(--gold-ink);
  }
  .card.soon{ opacity: 0.55; }
  .card.soon .badge{
    background: var(--panel-2);
    color: var(--muted);
    border: 1px solid var(--line);
  }
  .card.soon{ pointer-events: none; }

  .footer-note{
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 28px;
    line-height: 1.6;
  }

  @media (max-width: 380px){
    .wrap{ padding: 32px 14px 48px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <h1>가볍게 한 판</h1>
    <p>친구들과 내기할 때 쓰는 미니게임 모음<br>회원가입도, 저장도 없이 바로 플레이</p>
  </div>

  <div class="grid">
    <a href="games/ladder.html" class="card active">
      <span class="emoji">🪜</span>
      <span class="title">사다리타기</span>
      <span class="desc">이름 넣고 사다리 타면 결과가 랜덤으로</span>
      <span class="badge">바로 플레이</span>
    </a>
    <a href="games/lottery.html" class="card active">
      <span class="emoji">🎋</span>
      <span class="title">제비뽑기</span>
      <span class="desc">제비를 뽑아 순서 결정</span>
      <span class="badge">바로 플레이</span>
    </a>
    <a href="games/pirate-roulette.html" class="card active">
      <span class="emoji">🏴‍☠️</span>
      <span class="title">해적 룰렛</span>
      <span class="desc">칼을 꽂아 운명을 시험</span>
      <span class="badge">바로 플레이</span>
    </a>
    <a href="games/ball-race.html" class="card active">
      <span class="emoji">🏓</span>
      <span class="title">탁구공 레이스</span>
      <span class="desc">공들이 달려서 순위 결정</span>
      <span class="badge">바로 플레이</span>
    </a>
  </div>

  <p class="footer-note">모든 게임은 서버 저장 없이 브라우저에서만 실행돼요.</p>
</div>
</body>
</html>
